name: Build PragonMobile APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "=============== KOTLIN ERRORS ==============="
          grep -E "^e: " build.log | head -60 || true
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: PragonMobile-v10-apk
          path: app/build/outputs/apk/debug/*.apk
